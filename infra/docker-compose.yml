services:
  postgres:
    image: postgres:16-alpine
    container_name: subauditor_postgres
    environment:
      POSTGRES_USER: subauditor
      POSTGRES_PASSWORD: subauditor
      POSTGRES_DB: subscription_auditor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subauditor -d subscription_auditor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subauditor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
